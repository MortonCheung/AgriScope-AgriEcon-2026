  - data/raw/retained_source/city_data/shenyang/data/weather_extra_daily_era5land.csv
  - data/raw/retained_source/city_data/shenyang/data/disaster_events_observed.csv
  - data/raw/retained_source/city_data/shenyang/data/policy_events.csv
  - data/raw/retained_source/city_data/shenyang/data/phenology_events.csv
  - data/raw/retained_source/city_data/shenyang/data/input_cost_weekly.csv
  - data/raw/retained_source/city_data/chaoyang/data/price_observation.csv
