# 单位换算：统一到「元/公斤」作为 standard_unit
# 原始值 original_price + original_unit 永久保留，standard_price 只是新增字段
unit_conversion:
  "元/公斤": 1.0
  "元/kg": 1.0
  "元/千克": 1.0
  "元/吨": 0.001
  "元/斤": 2.0
  "元/500g": 2.0
  "元/百公斤": 0.01
  "元/袋": null      # 无法换算，保留原值，standard_price 置空
  "元/亩": null
