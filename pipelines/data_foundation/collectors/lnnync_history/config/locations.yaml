# 正文中常见的市场名后缀（历史文章常写作「鞍山台安县农贸市场」「大连果菜批发市场」）
# 解析时先从 location_raw 剥离这些后缀，再匹配行政区；原文仍完整保留在 location_raw。
market_suffixes:
  - 农贸市场
  - 农副产品批发市场
  - 农产品批发市场
  - 果菜批发市场
  - 蔬菜批发市场
  - 批发市场
  - 生鲜超市
  - 超市
  - 商场
  - 菜市场
  - 大市场
  - 市场

# 正文中表示「某地区」的模糊后缀，如「阜新地区」「锦州地区」
region_suffixes: [地区, 区域, 辖区, 境内]
