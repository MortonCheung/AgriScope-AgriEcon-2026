# 辽宁省行政区划映射（省 → 地级市 → 区县）
# 用途：把正文中的 location_raw 标准化为 province / city / county / geo_level
# 铁律：标准化结果只作为新增字段，location_raw 永远保留原文，不得覆盖。
# 铁律：沈北新区等市辖区只能归属沈阳市，绝不能升级为独立城市。

province: 辽宁省
province_aliases: [辽宁, 辽宁省, 全省, 全省平均]

cities:
  沈阳市:
    aliases: [沈阳]
